spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
mail.session.pfmailsession.emailEnabled=false
projectforge.gateway.push.enabled=false
projectforge.sipgate.token=
projectforge.mcp.enabled=true
projectforge.mcp.local-demo=true
projectforge.mcp.resource=http://localhost:18080/mcp
projectforge.mcp.client-registry-file=${projectforge.base.dir}/mcp-clients.properties
projectforge.fibu.number-ranges.allow-free-numbers=true
