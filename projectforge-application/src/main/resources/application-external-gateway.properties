#
# ProjectForge External Gateway Profile
#
# Activate with: --spring.profiles.active=external-gateway
# This profile runs ProjectForge as a reduced public-facing instance providing only:
# - CardDAV (address book sync)
# - CalDAV/ICS subscriptions (calendar export)
# - DataTransfer (file exchange areas)
# Authentication is via OAuth2/OIDC — configure the OAuth2 client properties
# in application.properties or via environment variables (see admin guide).
#

# Enable gateway mode
projectforge.gateway.enabled=true

# The gateway always runs behind a TLS-terminating reverse proxy (nginx). Evaluate its
# X-Forwarded-* headers, otherwise {baseUrl} becomes http://... and the OAuth2 redirect_uri
# does not match the https URI registered in the IdP. 'framework' instead of 'native', since
# with rootless Podman the proxy's address may not be in Tomcat's internal-proxies range.
# Do not publish the application port to untrusted networks: the headers are trusted blindly.
server.forward-headers-strategy=framework

# Shared secret for sync API (set via environment variable)
projectforge.gateway.sync.secret=${GATEWAY_SYNC_SECRET:}

# Only the data transfer: all other functions have no menu entries, their REST endpoints and next pages answer
# 404 (also the default in gateway mode, see FeatureService). No personal boxes: the areas are administered on the
# main instance.
projectforge.features.enabled=datatransfer
projectforge.features.disabled=DataTransferPersonalBox

# CardDAV enabled
projectforge.carddav.server.enable=true

# Ensure DataTransfer plugin is always active on the gateway
projectforge.plugins.ensure-active=datatransfer
