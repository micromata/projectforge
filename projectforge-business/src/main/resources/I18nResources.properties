administration.configuration.param.fibu.accounting.description=Account number ranges of debitors and creditors (e.g. "10000-12999") and the schema of the business assessment (BWA) with its rows: number, id, account range, value (a formula starting with "=" or a Groovy script), priority, title, indent, scale and unit. See the administration guide.
administration.configuration.param.fibu.contributionMargin=Contribution margin
administration.configuration.param.fibu.contributionMargin.description=Settings of the contribution margin (order book and scripts): the revenue accounts, the hourly rate for the time sheets of months without imported accounting records, the target percentage with the red threshold of the traffic light, and the assignment of cost 2 units without an own project to a project.
administration.configuration.param.fibu.costConfigured=Cost-unit accounting configured?
administration.configuration.param.fibu.costConfigured.description=Enables cost-unit accounting (Kost1/Kost2, refer to the documentation): cost units of projects and their cost 2 types, cost assignments of invoices and the related evaluations. Customers and projects are usable without it, with free numbers or those of the configured number ranges. Any change may be activated only after a re-login.
administration.configuration.param.fibu.defaultVAT=Default VAT (in %)
administration.configuration.param.fibu.defaultVAT.description=Will be used for pre-filling forms (e.g. for editing invoices).
administration.configuration.param.fibu.forecast=Forecast
administration.configuration.param.fibu.forecast.description=Settings of the forecast (order statistics): the hint on the planning date shown in its tooltip.
administration.configuration.param.groupNomenclature=Group nomenclature
administration.configuration.param.groupNomenclature.description=Naming convention of the groups (description, pattern and suffixes), which the project and structure wizards follow when suggesting names of new groups.
administration.configuration.param.holidays=Holidays
administration.configuration.param.holidays.description=Additional holidays (label, month, day of month, optional year) and changes of the pre-defined ones by id (e.g. XMAS_EVE): ignore, label, working day, work fraction (e.g. 0.5 for a half working day).
administration.configuration.param.hr.emailaddress=HR-Emailaddress
administration.configuration.param.hr.emailaddress.description=Mailaddress of HR for request of leave
administration.configuration.param.jira=JIRA
administration.configuration.param.jira.description=JIRA servers issue keys (e.g. PROJECTFORGE-222) in time sheets and tasks are linked to: a default browse url and further servers by the projects hosted on them. Without any url, no issues are linked.
administration.configuration.param.lanesAndPlanes=Lanes & Planes
administration.configuration.param.lanesAndPlanes.description=Settings of the push of the employees to the travel management Lanes & Planes: the invoice profile ids, the general Kost1 sent to all users as cost centers, the general Kost2 sent to all users as cost units, the patterns of the Kost2 sent to the users who may book them, the additional users who aren't employees, the names of the cost centers and cost units already existing in Lanes & Planes and the emails of the employees in Lanes & Planes. The technical settings (activation, API key, dry run) are in projectforge.properties.
administration.configuration.param.messageOfTheDay=Message of the day
administration.configuration.param.messageOfTheDay.description=This message will be displayed on the user's login screen. Please note: This message is also visible for unauthorized users!
administration.configuration.param.minPasswordLength=Minimal Password Length
administration.configuration.param.minPasswordLength.description=The minimal length of the user passwords.
administration.configuration.param.orga.contractTypes=Contract types
administration.configuration.param.orga.contractTypes.description=Types of contracts selectable in the contracts: a list of entries with value (short form, e.g. NDA) and label (e.g. Non-disclosure agreement).
administration.configuration.param.organization=Organization
administration.configuration.param.organization.description=The name of the organization is placed e.g. at pdf export files (such as timesheets or monthly employee reports) as title.
administration.configuration.param.password.flag.checkChange=Password has to change
administration.configuration.param.password.flag.checkChange.description=Password has to change each time it is redefined.
administration.configuration.param.pluginsActivated=Activated Plugins
administration.configuration.param.pluginsActivated.description=List of activated plugins. Please do not edit this directly.
administration.configuration.param.systemAdministratorEMail=E-mail of administrators
administration.configuration.param.systemAdministratorEMail.description=ProjectForge sends e-mails to this address(es) in the case of special errors. You can specify one or more (coma separated) addresses (RFC822).
administration.configuration.param.systemAdministratorEMail.label=Administrators
administration.configuration.param.timesheet.noteSavingsByAI=Note regarding AI savings
administration.configuration.param.timesheet.noteSavingsByAI.description=Note in the time reports regarding AI savings (only visible if: projectforge.timesheets.timeSavingsByAI.enabled=true)
administration.configuration.param.timesheet.overlapGroups=Time sheet overlap groups
administration.configuration.param.timesheet.overlapGroups.description=Groups of cost 2 units whose time sheets must never overlap in time, even with shared costs: each group counts like one project. Groups are separated by semicolons, the cost 2 number prefixes of a group by commas. A prefix has one to four parts (number range, area, sub area, cost 2 type), e.g. "6" matches all cost 2 units 6.*. Examples: "6" (one group: all cost 2 units 6.*), "6.100.00.01,6.100.00.02,6.300" (one group of three prefixes), "6.100,6.300;6.200" (two groups). Time sheets on the same cost 2 never overlap, also without any group.
administration.configuration.param.timesheet.vacation.autoBookingDays=Book vacation as time sheets (days back on the first run)
administration.configuration.param.timesheet.vacation.autoBookingDays.description=Approved vacation (special leave included) is booked as time sheets by a nightly job, on the configured vacation task and cost unit. Only past days are booked, never in advance, and only working days without any time sheet of the user (half days with half the hours). Each day is processed once only: a run books the days from the last successful run on up to yesterday, so failed runs and nights the job didn't run are caught up (at most 62 days back); the very first run books this number of days back (max. 7). A vacation time sheet deleted by hand is therefore not booked again. If no time sheet is bookable on the vacation task (closed, project ended), the runs fail and the days are booked once that is solved. A vacation approved only after its days were processed is not booked automatically (book it in the calendar). 0 disables the job.
administration.configuration.param.timesheet.vacation.kost2=Cost unit for vacation
administration.configuration.param.timesheet.vacation.kost2.description=The cost unit (Kost2, format #.###.##.##, e.g. 5.000.00.03) vacation is booked on as time sheets, together with the vacation task. It must be bookable on that task.
administration.configuration.param.timesheet.vacation.taskId=Task for vacation (id)
administration.configuration.param.timesheet.vacation.taskId.description=The id of the task (structure element) vacation is booked on as time sheets, in the calendar ("Book several days") and by the nightly job.
administration.configuration.param.timesheet.warnMissingKost2=Report time sheets without Kost2?
administration.configuration.param.timesheet.warnMissingKost2.description=If enabled, a time sheet saved without Kost2 (on a structure element without Kost2) gets a hint to contact the project management or accounting, the notification rule "Time sheets without Kost2" applies and such entries are marked in the monthly report. Booking without Kost2 stays possible. Only applies with cost-unit accounting enabled.
administration.configuration.param.timesheetTags=Time sheet tags
administration.configuration.param.timesheetTags.description=If defined, a semicolon separated list of tags (strings). On each time sheet the user may add one of these tags.
administration.configuration.param.timezone=Default time zone
administration.configuration.param.timezone.description=This default time zone is used, if no other time zone is set. This time zone is used as pre-set time zone for new users. If no value is configured then the system's default time zone (Java vm) is used. You can modify this value whenever you want, the time stamps in the database are always stored in the independent UTC format.
