Here you can import creditor invoices in CSV format (.csv) from Datev.
fibu.eingangsrechnung.import.headerOnly.newInvoicesSkipped=New invoices cannot be created using this file. Please use the import with invoice positions. {0} new invoice(s) will be ignored.
fibu.eingangsrechnung.import.job.title=Import creditor invoices
fibu.eingangsrechnung.import.templateInfo=## Description:\n\
- These files are generated by DATEV.\n\
- The import takes place in two steps, both of which must be carried out consecutively for **new** invoices.\n\
- The invoices or invoice positions can be re-imported independently at any time to update the data.\n\
- ProjectForge automatically detects whether invoices or positions are being imported.\n\
- It is best to export for **individual months**.\n\
- After uploading a file, the import file can be compared with the ProjectForge invoices and then you can select which invoices/positions should be imported.\n\
\n\
**Step 1: Import invoice positions** (required for **new** invoices)\n\
- The files are created in Datev via "Belegdaten exportieren" -> "Rechnungseingang exportieren" (files end with **"Lieferantenrechnungen.csv"**).\n\
- This import is used to create new invoices and to update invoices (with positions).\n\
- Invoices and positions no longer included in the import can also be deleted.\n\
- Supported columns: "Periode", "Betrag", "Währung", "Datum", "RENR", "LieferantName", "LieferantKonto", "Ware/Leistung", "Fällig_am", "Steuer%", "KOST1", "KOST2"\n\
\n\
**Step 2: Update invoice information** (optional)\n\
- In Datev, select the desired month as the period in the "Belegübersicht" and generate the file (files end with **"export.csv"**).\n\
- This import only updates the header data of existing invoices (payment date, etc.) without changing the positions.\n\
- Invoices no longer included in the import can also be deleted if desired.\n\
- Supported columns: "Geschäftspartner-Name", "Geschäftspartner-Konto", "WKZ", "Rechnungs-Nr.", "Rechnungsdatum", "Konto", "Ware/Leistung", "BezahltAm", "Fällig mit Skonto 1", "Skonto 1 in %", "Fällig ohne Skonto", "IBAN", "BIC", "Notiz"\n
