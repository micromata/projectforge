administration.configuration.accounting.help.order=Order: a record belongs to the first row from the top whose accounts match its account or contra account. Calculated rows are calculated from the top as well, so a calculated row a formula refers to has to be above it.
administration.configuration.accounting.help.priority=Priority: importance of the row. A short form of the business assessment (e.g. in reports or scripts) contains only rows of high or highest priority. Empty: middle.
administration.configuration.accounting.help.rows=The rows of the business assessment in the order shown. A row either sums up the records of its accounts, or calculates its amount by its value, or is an empty separator line (only a number or nothing).
