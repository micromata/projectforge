fibu.kost.reporting.help.attributes=**Attributes:** `id` names the report (shown as column head and in the path), `title` describes it. Without `suppressOther="true"` the accounting records of a report that match none of its children are shown as additional column `<id> - Other`; without `suppressDuplicates="true"` the records matching more than one child are shown as column `<id> - Duplicates`. Both columns help to check that the children are complete and free of overlaps.
fibu.kost.reporting.help.drilldown=**Drill-down:** A column head shown as link opens the report of this child objective with its own children as columns; the path above the table leads back. The amounts and the icon next to a column head open the accounting records behind it (requires the right for the DATEV import).
fibu.kost.reporting.help.example=```xml\n<ReportObjective title="Customer ACME" id="ACME" suppressOther="true" suppressDuplicates="true">\n  <kost1-include>3.*</kost1-include>\n  <kost1-exclude>*.01</kost1-exclude>\n  <kost2-include>5.*</kost2-include>\n  <kost2-exclude>*.02</kost2-exclude>\n  <ReportObjective title="Project ACME-WEB-Portal" id="ACME-WEB-Portal">\n    <kost2-include>5.020.01.*</kost2-include>\n  </ReportObjective>\n  <ReportObjective title="Project ACME-Java-Migration" id="ACME-Java-Migration">\n    <kost2-include>5.020.02.*</kost2-include>\n  </ReportObjective>\n</ReportObjective>\n```
fibu.kost.reporting.help.intro=A report objective is an XML file describing a tree of reports. Each report selects accounting records by their cost 1 and cost 2 units; nested report objectives refine the selection of their parent.
fibu.kost.reporting.help.rules=**Selection rules:**\n- An empty include list matches all records.\n- A non-empty include list requires at least one of its entries to match.\n- With several include lists (cost 1 and cost 2) a record must match all of them.\n- A record matching any entry of an exclude list is excluded.\n- A nested report objective can only select records of its parent (always a subset).
fibu.kost.reporting.help.storage=The uploaded report objectives are kept in memory until logout or server restart. Use "Clear" to load other ones.
fibu.kost.reporting.help.title=Format of the report objectives
fibu.kost.reporting.help.wildcards=**Expressions:** The entries are Java regular expressions (`java.util.regex.Pattern`) matched against the formatted cost unit (e.g. `5.020.01.03`). For convenience every `.` is escaped and `*` stands for any characters: `3.*` matches everything starting with "3.", `*.02` everything ending with ".02". An expression starting with an apostrophe is used as it is (without the apostrophe), e.g. `'^5\\.510.*`.
fibu.kost.reporting.intro=Evaluates the accounting records by report objectives: upload a report objectives file (XML) or paste its content, choose the period and create the report. The result is a business assessment (BWA) of the report and of each of its child reports side by side.
