fibu.auftrag.contributionMargin.breakdown.calculated=The values of orders and structure elements are calculated, as the accounting records know the project (kost2) only: revenue from the invoice positions of the order positions, costs from the time sheets × hourly rate ({0}). Time sheets go to the order positions of the nearest structure element upwards. What can''t be assigned, and the difference to the accounting records, stays with the project as residual, so the rows of a project add up to its contribution margin.
