<head>
    <style type="text/css">
        /*
         * Shared mail style, following the projectforge-next design (projectforge-next/app/globals.css): brand
         * teal accent, neutral greys, white card with 10px radius. Hex values, because mail clients don't know
         * oklch, and no web fonts: only the fallback chain of Plus Jakarta Sans / Geist Mono applies.
         */
        div#mail {
            font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #252525;
            font-size: 15px;
            line-height: 1.5;
        }

        div.container {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 0;
        }

        div.content {
            background-color: #fff;
            text-align: left;
            color: #252525;
            border: 1px solid #e5e5e5;
            border-top: 4px solid #009ba3;
            border-radius: 10px;
            padding: 28px 32px;
        }

        img.logo {
            float: right;
            max-height: 40px;
        }

        h1.title {
            margin: 8px 0 16px;
            color: #252525;
            font-size: 22px;
            font-weight: 600;
        }

        h2.section {
            margin: 28px 0 8px;
            color: #252525;
            font-size: 16px;
            font-weight: 600;
        }

        h3 {
            margin: 28px 0 4px;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
        }

        p {
            text-align: left;
        }

        p.info {
            font-size: 13px;
            color: #737373;
        }

        p.info b {
            display: block;
            color: #252525;
        }

        a {
            font-weight: 600;
            text-decoration: none;
            color: #009ba3;
        }

        a:hover {
            color: #007480;
        }

        a.button {
            margin: 20px 0;
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            font-weight: 600;
            background-color: #009ba3;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
        }

        a.button:hover {
            background-color: #007480;
            color: #fff;
        }

        @media only screen and (max-width: 725px) {
            div.container {
                width: 95%;
            }

            div.content {
                padding: 20px 16px;
            }

            h1.title {
                font-size: 18px;
            }
        }

        table, tbody, tr {
            width: 100%;
        }

        table {
            border-collapse: collapse;
            /* Tables don't inherit the font size without a doctype (quirks mode). */
            font-size: inherit;
        }

        tr.even {
            background-color: #fafafa;
        }

        td {
            padding-top: .25em;
            padding-right: 12px;
            vertical-align: top;
        }

        /* Column headers of data tables, e.g. the history of changes. */
        tr th {
            padding: 6px 12px 6px 0;
            border-bottom: 1px solid #e5e5e5;
            color: #737373;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Headings within the field tables, e.g. the positions of an order. */
        table.width-2 tr th, table.width-3 tr th {
            padding: 1.5em 0 0;
            border-bottom: none;
            color: #252525;
            font-size: 15px;
            white-space: normal;
        }

        table.width-2 tr:first-child th, table.width-3 tr:first-child th {
            padding-top: 0;
        }

        td, th {
            text-align: left;
        }

        table.width-2 td {
            width: 50%;
        }

        table.width-3 td {
            width: 33%;
        }

        td span.title {
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #737373;
            font-size: 11px;
            font-weight: 600;
        }

        td span.value {
            display: block;
            color: #252525;
            font-weight: 400;
        }

        .no-wrap {
            white-space: nowrap;
        }

        .muted {
            color: #737373;
        }

        .small {
            font-size: 12px;
        }

        .mono {
            font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
        }

        /* Small labels, e.g. the log level. */
        .badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .03em;
        }

        .badge-error {
            background-color: #fde8e8;
            color: #c10007;
            border: 1px solid #f8c4c4;
        }

        .badge-warn {
            background-color: #fff3d6;
            color: #3d2200;
            border: 1px solid #ffd98a;
        }

        .badge-info {
            background-color: #e5f5f6;
            color: #007480;
            border: 1px solid #b3e1e3;
        }

        /* Number of entries next to a section title. */
        .pill {
            display: inline-block;
            margin-left: 6px;
            padding: 0 8px;
            border-radius: 10px;
            background-color: #f5f5f5;
            color: #737373;
            font-size: 12px;
            font-weight: 600;
        }

        /* Key figures as tiles. */
        table.kpi {
            /* The negative margin compensates the border spacing, so the tiles are aligned with the text. */
            width: calc(100% + 16px);
            margin: 16px -8px 8px;
            /* Not table-layout: fixed (equal tiles): a big number like 1,149,892 wouldn't fit into its tile. */
            border-collapse: separate;
            border-spacing: 8px 0;
        }

        table.kpi td {
            padding: 12px 14px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
        }

        table.kpi span.number {
            display: block;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
            color: #252525;
        }

        table.kpi span.number.error {
            color: #e10057;
        }

        table.kpi span.number.warn {
            color: #ff9d01;
        }

        /* Lists of entries, one row each. */
        table.list td {
            padding: 8px 6px;
            font-size: 14px;
            border-bottom: 1px solid #e5e5e5;
            word-break: break-word;
        }

        table.list tr:last-child td {
            border-bottom: none;
        }

        table.list td.count {
            width: 1%;
            padding-right: 12px;
            text-align: right;
            white-space: nowrap;
            font-weight: 600;
        }

        p.footer {
            margin-top: 28px;
            font-size: 12px;
            color: #737373;
        }
    </style>
</head>
