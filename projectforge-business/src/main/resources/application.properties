### SMS & telephony

# Url of the SMS gateway, e.g. http://smsgateway.acme.local/api.php
projectforge.sms.url=

# POST or GET (default).
projectforge.sms.httpMethod=GET

# Maximum length of a message (ensured by ProjectForge).
projectforge.sms.smsMaxMessageLength=1000

# The pattern of the response string for service calls with error in phone number (receiver).
projectforge.sms.returnCodePattern.numberError=

# The pattern of the response string for service calls with error in message to send.
projectforge.sms.returnCodePattern.messageError=

# The pattern of the response string for service calls with error caused by a too large message to send.
projectforge.sms.returnCodePattern.messageToLargeError=

# The pattern of the response string for service calls with errors.
projectforge.sms.returnCodePattern.error=^Error.*

# This pattern will be checked last and is needed to check the success of the service.
projectforge.sms.returnCodePattern.success=^OK.*

# You may add all parameters (get or post) your sms service requires.
# Variables #number and #message will be replaced by the user's form input.
projectforge.sms.httpParameters={username:'projectforge',text:'#message',to:'#number'}

# If given and sms is configured, a rest call is provided secured by this auth key (see MessagingServiceRest).
projectforge.sms.publicRestCallAuthKey=

# Key for securing the public phone lookup service (PhoneLookupRest).
projectforge.phoneLookupKey=

# Number of the telephone system.
projectforge.telephoneSystemNumber=0123456789i

### Interfaces

# Sipgate interface: specify uri and token id/token for activating it.
projectforge.sipgate.baseUri=
projectforge.sipgate.tokenId=
projectforge.sipgate.token=

# Sipgate: this device is used for calls, if the user doesn't use configured sipgate devices. The user may use any
# foreign caller number. Foreign caller numbers may be specified by the user via MyAccount page (e.g. "p2").
projectforge.sipgate.defaultDevice=

# Sipgate work-around: this number is used as base-number for building full numbers.
projectforge.sipgate.basePhoneNumber=

# Sipgate: if true, any changes in Sipgate will update local addresses (false only for testing).
projectforge.sipgate.updateLocalAddresses=true

# Sipgate: if true, remote contacts in Sipgate will be updated/created/deleted (false only for testing).
projectforge.sipgate.updateSipgateContacts=true

# Sipgate: when to run the sync (e.g. nightly at 00:50; seconds minutes hours day-of-month month day-of-week) and
# whether the sync job is active at all.
projectforge.sipgate.cron.sync=0 50 0 * * *
projectforge.sipgate.cron.sync.active=false

# Lanes & Planes interface: pushes the active employees with their bookable Kost2 (cost units) and their Kost1
# (reference cost center) to the user import of Lanes & Planes. Attention: Lanes & Planes deactivates all users not
# sent.
projectforge.lanesandplanes.enabled=false
projectforge.lanesandplanes.url=https://api.lanes-planes.com/ext/users

# Lanes & Planes: API access token (personal settings of a Lanes & Planes admin account).
# The invoice profile ids, the general Kost2, the patterns of the Kost2 and the target field are maintained by
# finance in the configuration parameter 'lanesAndPlanes' (Administration -> Configuration).
projectforge.lanesandplanes.apiKey=

# Lanes & Planes: if true, the user list is only written to <work directory>/lanes-and-planes-users.json, nothing is
# sent.
projectforge.lanesandplanes.dryRun=true

# Lanes & Planes: nothing is sent, if fewer active employees are found.
projectforge.lanesandplanes.minUsers=1

# Lanes & Planes: interval and initial delay of the sync in milliseconds.
projectforge.lanesandplanes.syncIntervalMs=3600000
projectforge.lanesandplanes.initialDelayMs=300000

# CardDAV server: enable or disable it.
#projectforge.carddav.server.enable=true

# CardDAV: VCard version to use (3.0 or 4.0).
#projectforge.carddav.server.vcardVersion=3.0

# CardDAV: photo mode for VCard generation, "url" or "embedded".
# - url: Use URL references (smaller VCards, faster sync, may have line-folding issues with long URLs in VCard 3.0)
# - embedded: Use Base64-encoded images (larger VCards, slower sync, no line-folding issues, works offline)
#projectforge.carddav.server.photoMode=embedded

# CardDAV: if set, all CardDAV requests/responses for this user will be logged to files.
#projectforge.carddav.server.debugUser=

# External gateway: set to true to run this instance as a reduced public-facing gateway (CalDAV, ICS, DataTransfer
