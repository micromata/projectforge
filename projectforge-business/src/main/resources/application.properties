projectforge.gateway.enabled=false

# On the gateway: the secret the push of the main instance has to send (its projectforge.gateway.push.secret).
#projectforge.gateway.sync.secret=

# External gateway: push sync to the external gateway (set to true on the main instance to push data to the gateway).
projectforge.gateway.push.enabled=false
