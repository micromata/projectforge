name: GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - '.github/workflows/**'
  # The release pills of the changelog show the jar and docker images of a release once they exist (see
  # site/fetch-binaries.sh): a new GitHub release, docker/push-release.sh (workflow_dispatch) and, as fallback, daily.
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: site

      - uses: actions/configure-pages@v5

      - name: Fetch the released binaries
        run: ./fetch-binaries.sh
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ../_site
        working-directory: site
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
