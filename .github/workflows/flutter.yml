# The mobile app (projectforge-flutter): analyzer and unit tests. Its generated i18n catalogs are checked by
# GenerateAppI18nMessagesTest in the Gradle build. Replaced by app.yml (projectforge-app) at the cutover.
on:
  push:
    branches: [ develop ]
    paths:
      - 'projectforge-flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'projectforge-flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projectforge-flutter

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
