# Text sections of the German home page, rendered by _includes/text-section.html (fields: see there)

dach:
  title: Spricht DATEV. Kennt XRechnung.
  subtitle: Gemacht für Unternehmen in Deutschland, Österreich, der Schweiz und der EU.
  text: >-
    DATEV-Buchungssätze und Eingangsrechnungen importieren, Gehälter exportieren, PEPPOL-fähige E-Rechnungen
    als XRechnung und ZUGFeRD erstellen, vor dem Export auf Vollständigkeit geprüft. Feiertage, Urlaubskonten und eine
    deutsch-englische Oberfläche sind eingebaut.
  img: screenshots/2026-Liquidity.png
  img_caption: Die Liquiditätsplanung verbindet Rechnungen, erwartete Zahlungen und wiederkehrende Serien.

sovereignty:
  title: Deine Daten. Dein Server. Deine Regeln.
  subtitle: Digitale Souveränität statt Abhängigkeit – und die DSGVO als Frage der eigenen Richtlinien.
  text: >-
    ProjectForge läuft dort, wo es laufen soll: auf dem eigenen Server, im eigenen Rechenzentrum oder bei einem selbst
    gewählten Hoster. Aufträge, Zeitberichte, Gehälter, Dateien und Chats bleiben dort – keine Hersteller-Cloud,
    kein Tracking durch Dritte.
  bullets:
    - "**Selbst betrieben** – die eigene Organisation entscheidet, wo die Daten liegen, wer darauf zugreift, wie lange sie aufbewahrt werden und wann aktualisiert wird."
    - "**Keine Daten in fremder Cloud** – keine Telemetrie, keine externen Skripte, Schriften oder Tracker; der Browser lädt alles vom eigenen Server."
    - "**Open Source** – der Code ist für alle prüfbar, und die Daten liegen in der eigenen PostgreSQL-Datenbank: keine Abhängigkeit vom Anbieter."
    - "**DSGVO-tauglich von Grund auf** – fein abgestufte Rechte, eine lückenlose Änderungshistorie, Datenschutz durch Voreinstellungen und Chats, die in der App nur die Teilnehmenden lesen."
    - "**Ende-zu-Ende-verschlüsselte** vertrauliche Chat-Nachrichten – nie gespeichert, nicht einmal in Backups."
  button_text: Digitale Souveränität und DSGVO
  button_url: /de/docs/userguide/#data_sovereignty_and_gdpr

security:
  title: Ruhige Nächte für Admins.
  subtitle: ProjectForge passt sich der IT an – nicht umgekehrt.
  bullets:
    - "**Single Sign-on** mit Keycloak oder Authentik, oder LDAP – als Client oder als Master."
    - "**Zwei-Faktor-Login** mit Authenticator-Apps, WebAuthn-Sicherheitsschlüsseln, Codes per Mail oder SMS."
    - "**Feingranulare Rechte** bis auf einzelne Strukturelemente, und jede Änderung bleibt in der Historie erhalten."
    - "**Docker-Image oder JAR**, PostgreSQL, automatische Datenbankmigrationen."
    - "**System-Dashboard**, das Probleme sammelt und eine Zusammenfassung mailt – bevor es den Benutzern auffällt."
  img: screenshots/2026-SystemDashboard.png
  reverse: true
  img_caption: Das System-Dashboard zeigt jedes Teilsystem mit seinen Fehlern der letzten Tage.
  button_text: Installationsanleitung (EN)
  button_url: /docs/installation/

chat:
  title: Reden, wo die Arbeit ist.
  subtitle: Ein Chat direkt in ProjectForge – kein zusätzliches Tool, keine Daten in fremder Cloud.
  text: >-
    Räume für Teams, Projekte oder Kunden und Direktnachrichten an alle Kolleginnen und Kollegen – direkt neben den
    Aufträgen, Zeitberichten und Dateien, um die es geht. Nachrichten kommen live an, und alles bleibt auf dem eigenen
    Server.
  bullets:
    - "**Räume und Direktnachrichten** – Personen und Gruppen auswählen; wer später in eine Gruppe kommt, ist sofort dabei. Mitlesen können nur die Teilnehmenden, auch Administratoren nicht."
    - "**Dateien jeder Art** per Einfügen oder Drag & Drop, abgelegt im Datentransfer und so lange aufbewahrt, wie im Raum eingestellt."
    - "**Formatierung, Codeblöcke, Emoji-Reaktionen und Threads** – @-Erwähnungen benachrichtigen sofort, in der App und per Mail."
    - "**Vertrauliche Nachrichten** für ein Passwort: Ende-zu-Ende-verschlüsselt, vom Server nie gespeichert, nur einmal angezeigt."
    - "**Ungelesenes auf einen Blick** – Nachrichten als ungelesen markieren, Threads mit neuen Antworten sind gekennzeichnet, Mails nur für das, was in der App nicht gesehen wurde."
  img: screenshots/2026-ChatRoom-de.png
  img_caption: Ein Projektraum mit Codeblock, Bild, Reaktionen und Thread.
  button_text: Alle Funktionen zur Zusammenarbeit
  button_url: /de/features/#collaboration

proof:
  title: Praxiserprobt seit 2001.
  text: >-
    ProjectForge begann als internes Werkzeug von Micromata – und steuert unser Unternehmen bis heute jeden Tag,
    vom ersten Zeitbericht am Morgen bis zum Jahres-Forecast. Wir entwickeln es, weil wir es brauchen, und wir teilen
    es, weil gute Software besser wird, wenn andere sie auch nutzen. Version 9 (2026) brachte eine komplett neue,
    moderne Oberfläche auf einem aktuellen Technologie-Stack.
  button_text: Was ist neu
  button_url: /de/changelog-posts/

services:
  title: Unterstützung gewünscht? Wir sind da.
  text: >-
    Wir haben ProjectForge gebaut, also kennen wir es am besten. Auf Wunsch hosten wir die Instanz, helfen beim
    Aufsetzen von Strukturen, Rechten und Kostenrechnung, importieren vorhandene Daten, binden LDAP oder Single
    Sign-on an oder entwickeln die benötigten Erweiterungen.
  button_text: Professionelle Services
  button_url: /de/services/
