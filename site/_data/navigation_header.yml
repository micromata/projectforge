# Navigation of the site header (_includes/header.html).
# links: the main navigation; match marks a link active on every page whose url contains it.
# actions: the buttons on the right (style: primary, outline or ghost).

links:
  - title: Features
    url: /features/

  - title: Docs
    url: /docs/quickstart/
    match: /docs/

  - title: Services
    url: /services/

  - title: FAQ
    url: /#faq

  - title: About
    url: /about/

  - title: GitHub
    url: https://github.com/micromata/projectforge/

actions:
  - title: Changelog
    url: /changelog-posts/
    style: ghost

  - title: Download
    url: /download/
    style: primary
