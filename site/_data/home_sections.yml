# Text sections of the home page, rendered by _includes/text-section.html (fields: see there)

dach:
  title: Speaks DATEV. Knows XRechnung.
  subtitle: Made for companies in Germany, Austria, Switzerland and the EU.
  text: >-
    Import your DATEV accounting records and incoming invoices, export salaries, create PEPPOL-ready
    e-invoices in XRechnung and ZUGFeRD, checked for completeness before export. Public holidays, leave accounts and an
    English/German interface are built in.
  img: screenshots/2026-Liquidity.png
  img_caption: The liquidity forecast combines invoices, expected payments and recurring series.

sovereignty:
  title: Your data. Your server. Your rules.
  subtitle: Digital sovereignty instead of dependence – and GDPR as a matter of your own policies.
  text: >-
    ProjectForge runs where you want it: on your own server, in your data center or with a hoster you choose.
    Orders, timesheets, salaries, files and chats stay there – no vendor cloud, no third-party tracking.
  bullets:
    - "**Self-hosted** – you decide where the data lives, who has access, how long it is kept and when you update."
    - "**No data in someone else's cloud** – no telemetry, no external scripts, fonts or trackers; the browser loads everything from your server."
    - "**Open source** – the code can be checked by anybody, and your data is in your own PostgreSQL database: no vendor lock-in."
    - "**GDPR-ready by design** – fine-grained rights, a full history of changes, privacy by default and chats that only their participants read in the app."
    - "**End-to-end encrypted** confidential chat messages – never stored, not even in backups."
  button_text: Data sovereignty and GDPR
  button_url: /docs/userguide/#data_sovereignty_and_gdpr

security:
  title: Sleep well, admins.
  subtitle: ProjectForge fits into your IT – not the other way round.
  bullets:
    - "**Single sign-on** with Keycloak or Authentik, or LDAP – as client or as master."
    - "**Two-factor login** with authenticator apps, WebAuthn security keys, mail or SMS codes."
    - "**Fine-grained rights** down to single tasks, and every change is kept in the history."
    - "**Docker image or JAR**, PostgreSQL, automatic database migrations."
    - "**System dashboard** that collects problems and mails you a digest – before your users notice."
  img: screenshots/2026-SystemDashboard.png
  reverse: true
  img_caption: The system dashboard shows every subsystem with its errors of the last days.
  button_text: Installation guide
  button_url: /docs/installation/

chat:
  title: Talk where the work is.
  subtitle: A chat built into ProjectForge – no extra tool, no data in someone else's cloud.
  text: >-
    Rooms for teams, projects or customers, and direct messages to any colleague – right next to the orders,
    timesheets and files they are about. Messages arrive live, and everything stays on your own server.
  bullets:
    - "**Rooms and direct messages** – choose people and groups; whoever joins a group later is in at once. Only the participants read along, administrators neither."
    - "**Files of any type** by paste or drag & drop, stored in the data transfer and kept as long as the room says."
    - "**Formatting, code blocks, emoji reactions and threads** – @mentions notify at once, in the app and by mail."
    - "**Confidential messages** for a password: end-to-end encrypted, never stored by the server, shown only once."
    - "**Unread at a glance** – mark a message unread, threads with new replies are marked, mails only for what wasn't seen in the app."
  img: screenshots/2026-ChatRoom.png
  img_caption: A project room with a code block, an image, reactions and a thread.
  button_text: All collaboration features
  button_url: /features/#collaboration

proof:
  title: Battle-tested since 2001.
  text: >-
    ProjectForge started as Micromata's own tool – and it still runs our company every day, from the
    first timesheet in the morning to the yearly forecast. We develop it because we need it, and we
    share it because good software gets better when others use it too. Version 9 (2026) brought a
    completely new, modern interface on an up-to-date technology stack.
  button_text: What's new
  button_url: /changelog-posts/

services:
  title: Want a hand? We're here.
  text: >-
    We built ProjectForge, so we know it best. On request we host your instance, help you set up
    structures, rights and cost accounting, import your existing data, connect LDAP or single sign-on,
    or build the extensions you need.
  button_text: Professional services
  button_url: /services/
