plugins.cveradar.rights.cases={0} see the cases. {1} create and edit them.
plugins.cveradar.rights.catalog=Everybody logged in reads the catalogue and picks from it when entering the technologies of a component. The {1} and the {2} maintain it.
plugins.cveradar.rights.closure={0} see counts only, no persons. {1} see the devices of the persons, create team checks and close cases. A case with open items is closed by {2} only.
plugins.cveradar.rights.devices=Only the {1} see the devices, they are personal data.
plugins.cveradar.rights.file={0} read the file and join the discussion. {1} take over, rate, and maintain the measures and team checks. The binding priority is set by the assignee or {2}; only {2} reassign a case that somebody else has taken over.
plugins.cveradar.rights.inventory=Everybody logged in creates areas with a group of their own. The groups named on an area and on the areas above it see and change it with everything below. The {1} read systems that are internal; confidential ones are for those groups and the {2} only. The {2} also move areas, e.g. below a customer. Everybody sees the way to what they may see, but not the other areas on that way.
plugins.cveradar.rights.label=Rights on this page
plugins.cveradar.rights.list={0} see the list and open the files. {1} edit several entries at once (take over, priority, status). Everybody else is sent to "My".
plugins.cveradar.rights.my=Everybody logged in sees their own devices, the measures to confirm and the checks of their own groups here.
