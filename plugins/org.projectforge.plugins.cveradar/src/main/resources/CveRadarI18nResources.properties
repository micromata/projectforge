plugins.cveradar.priority.hint.P1=Critical: act immediately. Typically a vulnerability listed in the KEV catalogue or exploited on an exposed system. Shortest triage and remediation deadlines.
plugins.cveradar.priority.hint.P2=High: fix soon. Typically a CVSS score of 9 or more, or a P3 raised by an additional risk.
plugins.cveradar.priority.hint.P3=Medium: fix in the regular maintenance cycle. Typically a CVSS score of 7 or more.
plugins.cveradar.priority.hint.P4=Low: fix when convenient, e.g. with the next update. Typically a CVSS score below 7.
