plugins.cveradar.rights.file={0} lesen die Akte und diskutieren mit. {1} übernehmen, bewerten und pflegen die Maßnahmen und Teamprüfungen. Die verbindliche Priorität setzen die bearbeitende Person oder {2}; einen von anderen übernommenen Fall weisen nur {2} neu zu.
plugins.cveradar.rights.inventory=Alle Angemeldeten legen Bereiche mit einer eigenen Gruppe an. Die Gruppen an einem Bereich und an den Bereichen darüber sehen und ändern ihn mit allem darunter. {1} lesen Systeme der Stufe „intern“; vertrauliche sind nur für diese Gruppen und {2}. {2} hängen Bereiche auch um, etwa unter einen Kunden. Den Weg zu dem, was sie sehen dürfen, sehen alle, die übrigen Bereiche auf diesem Weg nicht.
plugins.cveradar.rights.label=Rechte auf dieser Seite
plugins.cveradar.rights.list={0} sehen die Liste und öffnen die Akten. {1} bearbeiten mehrere Einträge gemeinsam (übernehmen, Priorität, Status). Alle anderen landen bei „Meine“.
plugins.cveradar.rights.my=Alle Angemeldeten sehen hier die eigenen Geräte, die Maßnahmen zum Bestätigen und die Prüfungen der eigenen Gruppen.
