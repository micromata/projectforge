plugins.cveradar.rights.cases={0} sehen die Fälle. {1} legen sie an und bearbeiten sie.
plugins.cveradar.rights.catalog=Alle Angemeldeten lesen den Katalog und wählen daraus, wenn sie die Technologien einer Komponente eintragen. {1} und {2} pflegen ihn.
plugins.cveradar.rights.closure={0} sehen nur Zahlen, keine Personen. {1} sehen die Geräte der Personen, legen Teamprüfungen an und schließen Fälle. Ein Fall mit offenen Punkten wird nur von {2} geschlossen.
