server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    # Largest file a user may upload (attachments, data transfer areas).
    # nginx' default is 1 MB, and exceeding it is answered with 413 - so this must be at least
    # spring.servlet.multipart.max-request-size, or ProjectForge never sees the request at all.
    # Mind every proxy in front of this one (a load balancer, an SSO proxy such as Authentik):
    # each enforces its own limit and the smallest one wins.
    client_max_body_size 10G;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream the body through instead of spooling the whole upload to client_body_temp_path
        # first. Without this a large upload needs its size in free disk space before it starts.
        proxy_request_buffering off;

        # Generous enough for a large upload over a slow line; the defaults (60s) cut the
        # connection while the body is still on its way.
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}
