# HTTP-only configuration for obtaining the initial Let's Encrypt certificate.
# nginx.conf cannot be used for this, since its 443 server block requires the
# certificate that does not exist yet.
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
