# Public URL the gateway is reached at, including the port if the container port is
# published directly. This is the {baseUrl} of the OAuth2 redirect URI below and must match
# what is registered in Authentik. Behind the nginx/TLS setup use https://<host> instead.
projectforge.domain=http://localhost:8090

# Gateway mode. The sync secret is set here rather than via the GATEWAY_SYNC_SECRET
# environment variable: this file has the higher priority anyway, and keeping the secret out
# of the compose file keeps it out of version control and out of `podman inspect` output.
projectforge.gateway.enabled=true
projectforge.gateway.sync.secret=CHANGE_ME

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/projectforge
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=projectforge
spring.datasource.password=projectforge-gw-pass
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CardDAV
projectforge.carddav.server.enable=true

# Required: the DAV and calendar tokens pushed by the main instance are stored encrypted,
# so without this key they cannot be decrypted. If the key is lost or changed later, all
# users have to renew their authentication passwords.
projectforge.security.authenticationTokenEncryptionKey=CHANGE_ME

# OAuth2/OIDC — only required for the DataTransfer UI. CardDAV and ICS authenticate via
# tokens and work without it. Without client-id the OAuth2UserService bean is not created.
# The redirect-uri must be registered in Authentik exactly (see projectforge.domain above).
#spring.security.oauth2.client.registration.authentik.client-id=YOUR_CLIENT_ID
#spring.security.oauth2.client.registration.authentik.client-secret=YOUR_CLIENT_SECRET
#spring.security.oauth2.client.registration.authentik.scope=openid,profile,email
#spring.security.oauth2.client.registration.authentik.authorization-grant-type=authorization_code
#spring.security.oauth2.client.registration.authentik.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#spring.security.oauth2.client.provider.authentik.issuer-uri=https://auth.example.com/application/o/projectforge/
