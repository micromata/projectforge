# Dependency-Track for the development of the CVE-Radar (PF-CVR-DT-MIG, phase 0 and 1); see README.md.
# Not for production: the passwords are fixed and the ports are bound to localhost only.
# The ports 8090/8091 keep clear of ProjectForge (808n, 300n).
name: dependency-track

services:
  apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.2.1
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
    environment:
      DT_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "dtrack"
      # The DNS forwarder of the Podman machine (gvproxy) drops AAAA queries without an answer, so the resolver
      # of the Alpine image fails both lookups after 5 s ("UnknownHostException: … Try again"). IPv4 only.
      EXTRA_JAVA_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - "apiserver-data:/data"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dependencytrack/frontend:5.2.1
    environment:
      API_BASE_URL: "http://localhost:8090"
    ports:
      - "127.0.0.1:8091:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - "postgres-data:/var/lib/postgresql"
    restart: unless-stopped

volumes:
  apiserver-data: {}
  postgres-data: {}
